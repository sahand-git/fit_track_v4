name: Build FitTrack v4 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-expo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FitTrack-v4.apk
          sha256sum FitTrack-v4.apk > FitTrack-v4.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v4-APK
          path: |
            FitTrack-v4.apk
            FitTrack-v4.apk.sha256

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v4.0.${{ github.run_number }}"
          gh release create "$TAG" FitTrack-v4.apk FitTrack-v4.apk.sha256 \
            --title "FitTrack v4 Android Release ($TAG)" \
            --notes "Standalone Android APK for FitTrack v4 rewritten with React Native & Expo based on the Google Stitch design system." \
            --clobber || true

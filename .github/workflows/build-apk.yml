name: Build FitTrack v4 Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-expo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Test Firestore rules
        run: npm run test:rules

  build-apk:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_ANDROID_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_ANDROID_SERVICES_JSON_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Configure Firebase for native build
        shell: bash
        run: |
          if [ -n "$GOOGLE_ANDROID_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_ANDROID_SERVICES_JSON_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/google-services.json"
            echo "GOOGLE_ANDROID_SERVICES_FILE=$GITHUB_WORKSPACE/google-services.json" >> "$GITHUB_ENV"
          fi
          if [ -z "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" ] || [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::warning::Firebase web config is not configured; Firebase authentication will be unavailable in this APK."
          fi

      - name: Verify Firebase Android configuration (google-services.json)
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const filePath = process.env.GOOGLE_ANDROID_SERVICES_FILE;
            if (!filePath || !fs.existsSync(filePath)) {
              console.error("\n========================================================");
              console.error("::error::Missing GOOGLE_ANDROID_SERVICES_JSON_BASE64 secret!");
              console.error("To build a release APK with working Google and Firebase sign-in:");
              console.error("1. Download google-services.json from Firebase Console (Project Settings -> General -> Your apps -> com.fittrack.expo).");
              console.error("2. Base64-encode it: base64 -w 0 google-services.json (or [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"google-services.json\")) in PowerShell).");
              console.error("3. Add it as GOOGLE_ANDROID_SERVICES_JSON_BASE64 in GitHub repository secrets (Settings -> Secrets and variables -> Actions).");
              console.error("See docs/google-services-setup.md for full step-by-step instructions.");
              console.error("========================================================\n");
              process.exit(1);
            }

            let json;
            try {
              json = JSON.parse(fs.readFileSync(filePath, "utf8"));
            } catch (err) {
              console.error("\n========================================================");
              console.error("::error::google-services.json is not valid JSON!");
              console.error("Ensure GOOGLE_ANDROID_SERVICES_JSON_BASE64 is valid base64-encoded UTF-8 JSON. Error: " + err.message);
              console.error("========================================================\n");
              process.exit(1);
            }

            if (!json.project_info || !json.project_info.project_id) {
              console.error("\n========================================================");
              console.error("::error::google-services.json is missing project_info.project_id!");
              console.error("Ensure you downloaded the full google-services.json directly from Firebase Console.");
              console.error("========================================================\n");
              process.exit(1);
            }

            const clientPackages = (json.client || []).map(c => c.client_info && c.client_info.android_client_info && c.client_info.android_client_info.package_name).filter(Boolean);
            if (!clientPackages.includes("com.fittrack.expo")) {
              console.error("\n========================================================");
              console.error("::error::google-services.json does not match package name com.fittrack.expo!");
              console.error("Found package names: " + (clientPackages.join(", ") || "none"));
              console.error("Register an Android app with package name com.fittrack.expo in Firebase Console and download the updated google-services.json.");
              console.error("========================================================\n");
              process.exit(1);
            }

            console.log("Firebase google-services.json verified successfully:");
            console.log("  Project ID: " + json.project_info.project_id);
            console.log("  Package: com.fittrack.expo");
          '

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Configure Production Release Signing Keys
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Production keystore secret detected. Decoding release keystore..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "" >> android/gradle.properties
            echo "# FitTrack Production Release Signing" >> android/gradle.properties
            echo "FITTRACK_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
            echo "FITTRACK_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> android/gradle.properties
            echo "FITTRACK_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> android/gradle.properties
            echo "FITTRACK_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> android/gradle.properties
            echo "PRODUCTION_SIGNING_CONFIGURED=true" >> $GITHUB_ENV
            echo "Release keystore configured successfully."
            echo ""
            echo "================================================================================"
            echo "=== RELEASE KEYSTORE SIGNING CERTIFICATE FINGERPRINTS ==="
            echo "Copy the SHA-1 below into Firebase Console -> Project Settings -> Your apps ->"
            echo "Android (com.fittrack.expo) -> SHA certificate fingerprints."
            echo "REQUIRED: Google Sign-In will fail with DEVELOPER_ERROR (status 10) without this SHA-1!"
            echo "================================================================================"
            keytool -list -v -keystore android/app/release.keystore -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:|Certificate fingerprints:" -A 3 || true
            echo "================================================================================"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not configured. Falling back to default debug signing."
            echo "PRODUCTION_SIGNING_CONFIGURED=false" >> $GITHUB_ENV
            if [ -f "$HOME/.android/debug.keystore" ]; then
              echo "=== DEBUG KEYSTORE FINGERPRINTS ==="
              keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:" || true
            fi
          fi

      - name: Build Standalone Release APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK Signature (apksigner)
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
            echo "Using apksigner from $BUILD_TOOLS"
            $BUILD_TOOLS/apksigner verify --verbose --print-certs "$APK_PATH" || true
          fi

      - name: Prepare APK download
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk FitTrack-v4.apk
          else
            find android/app/build/outputs/apk -name "*.apk" | head -n 1 | xargs -I {} cp {} FitTrack-v4.apk
          fi
          sha256sum FitTrack-v4.apk > FitTrack-v4.apk.sha256
          ls -lh FitTrack-v4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v4-APK
          path: |
            FitTrack-v4.apk
            FitTrack-v4.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fittrack-apk-${{ github.run_number }}
          name: "FitTrack APK #${{ github.run_number }}"
          body: |
            ## FitTrack v4 Android APK
            This build is generated from commit `${{ github.sha }}`. Guest mode is available without Firebase setup; account and Google sign-in features require the configured Firebase and OAuth build values.
          files: |
            FitTrack-v4.apk
            FitTrack-v4.apk.sha256

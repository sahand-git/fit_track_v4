name: Build FitTrack v4 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-expo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Configure Production Release Signing Keys
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Production keystore secret detected. Decoding release keystore..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "" >> android/gradle.properties
            echo "# FitTrack Production Release Signing" >> android/gradle.properties
            echo "FITTRACK_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
            echo "FITTRACK_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> android/gradle.properties
            echo "FITTRACK_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> android/gradle.properties
            echo "FITTRACK_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> android/gradle.properties
            echo "PRODUCTION_SIGNING_CONFIGURED=true" >> $GITHUB_ENV
            echo "Release keystore configured successfully."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not configured. Falling back to default debug signing."
            echo "PRODUCTION_SIGNING_CONFIGURED=false" >> $GITHUB_ENV
          fi

      - name: Build Standalone Release APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK Signature (apksigner)
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
            echo "Using apksigner from $BUILD_TOOLS"
            $BUILD_TOOLS/apksigner verify --verbose --print-certs "$APK_PATH" || true
          fi

      - name: Prepare APK download
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk FitTrack-v4.apk
          else
            find android/app/build/outputs/apk -name "*.apk" | head -n 1 | xargs -I {} cp {} FitTrack-v4.apk
          fi
          sha256sum FitTrack-v4.apk > FitTrack-v4.apk.sha256
          ls -lh FitTrack-v4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v4-APK
          path: |
            FitTrack-v4.apk
            FitTrack-v4.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4-standalone-apk
          name: FitTrack v4 Standalone Release
          body: |
            ## FitTrack v4 (Expo & React Native) — Offline Standalone APK
            - **Google Stitch Design System** (5-Tab Floating Navigation Dock, Barcode Scanner, Nutrition Insights, Weight Trajectory, Food Details Modal, and Adaptive Hydration).
            - **Pre-packaged Release Bundle**: Contains offline Hermes bytecode and all assets embedded directly in the APK. No Metro bundler or development server needed.
          files: |
            FitTrack-v4.apk
            FitTrack-v4.apk.sha256
